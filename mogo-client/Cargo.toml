[package]
name = "mogo-client"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "MongoDB wire-protocol client for mogoDB (OP_MSG, SCRAM-SHA-1/256, cursors, change streams)"

[lib]
name = "mogo_client"

[dependencies]
bson.workspace = true
serde.workspace = true
tokio.workspace = true
base64 = "0.22"
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
pbkdf2 = "0.12"
rand = "0.8"
uuid = { version = "1", features = ["v4"] }
percent-encoding = "2"
thiserror.workspace = true


[dev-dependencies]
tokio = { version = "1", features = ["full"] }
bson = { version = "2", features = ["chrono-0_4"] }