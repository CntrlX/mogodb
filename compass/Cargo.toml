[package]
name = "mogo-compass"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "MongoDB Compass-style GUI for mogoDB (egui/eframe)"

[[bin]]
name = "mogocompass"
path = "src/main.rs"

[features]
drive = ["dep:egui_kittest"]

[dependencies]
mogo-client.workspace = true
bson.workspace = true
tokio.workspace = true
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
egui = "0.37"
egui_extras = { version = "0.37", features = ["http"] }
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
chrono = { version = "0.4", features = ["serde"] }
rfd = "0.16"
open = "5"

[dependencies.egui_kittest]
version = "0.37"
features = ["eframe", "snapshot", "wgpu"]
optional = true

[dev-dependencies]
egui_kittest = { version = "0.37", features = ["eframe", "snapshot", "wgpu"] }
